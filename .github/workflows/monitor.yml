# Render the README from data/report.json.
#
# The e2e suite no longer runs here. Tests execute in an isolated Docker
# container (the `scheduler` service in the platform-content workspace), which
# owns the schedule, runs Playwright per project, and PUSHES the run summary to
# data/report.json in this repo. That push is this workflow's only trigger —
# this repo is a renderer now, not a runner.
#
# No trigger loop: the path filter is data/report.json, and this job only ever
# writes README.md, data/chart*.svg and the per-project badge JSONs.
name: Generate README
on:
  push:
    branches: [main]
    paths:
      - "data/report.json"
  workflow_dispatch:
jobs:
  generate-report:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate new readme
        run: bun run generate-readme
      - name: Commit changes
        run: |
          git config --local user.email "$USER_EMAIL"
          git config --local user.name "$USER_NAME"
          git pull
          git add README.md
          git add data
          git diff --quiet && git diff --staged --quiet || git commit -m "[bot] Update readme"
        env:
          USER_EMAIL: ${{ vars.USER_EMAIL }}
          USER_NAME: ${{ vars.USER_NAME }}
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PUSH_TOKEN }}
          branch: main
